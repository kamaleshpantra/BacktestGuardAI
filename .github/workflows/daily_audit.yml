name: Daily BacktestGuard AI Strategy Audit

on:
  schedule:
    # Runs Monday through Friday at 21:30 UTC (after US market close)
    - cron: '30 21 * * 1-5'
  workflow_dispatch:
    # Allows manual triggering directly from GitHub UI with custom inputs
    inputs:
      ticker:
        description: 'Asset / Ticker to audit'
        required: true
        default: 'AAPL'
      strategy:
        description: 'Strategy algorithm (rsi or ma)'
        required: true
        default: 'rsi'

jobs:
  daily-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite (Sanity Check)
        run: |
          python -m pytest tests/ -q

      - name: Execute Daily Strategy Audit & Send Telegram Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python run_daily.py \
            --ticker ${{ github.event.inputs.ticker || 'AAPL' }} \
            --strategy ${{ github.event.inputs.strategy || 'rsi' }}
